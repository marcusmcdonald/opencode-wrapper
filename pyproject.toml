[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opencode-wrapper"
version = "1.1.0"
description = "Run OpenCode inside an isolated Apptainer or Podman container"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.2.3",
    # Add opencode-specific dependencies here
    "spython>=0.3.14",
]

[project.scripts]
opencode = "opencode_wrapper.cli:main"
opencode-build = "opencode_wrapper.build_image:main"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pyright>=1.1.414",
    "ruff>=0.15.21",
]

[tool.hatch.build.targets.wheel.force-include]
"Dockerfile" = "opencode_wrapper/Dockerfile"

